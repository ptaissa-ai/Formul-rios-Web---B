{% extends "base.html" %}

{% block page_content %}

<div class="page-header">
    <h1>Login</h1>
</div>


{% if mensagem %}

<div class="alert alert-success">
    {{ mensagem }}
</div>

{% endif %}


<form
    action=""
    method="post"
    class="form"
    role="form">


    <div class="form-group required">

        <label
            class="control-label"
            for="email">

            Email

        </label>

        <input
            class="form-control"
            id="email"
            name="email"
            required
            type="email"
            value="">

    </div>


    <div class="form-group required">

        <label
            class="control-label"
            for="password">

            Password

        </label>

        <input
            class="form-control"
            id="password"
            name="password"
            required
            type="password"
            value="">

    </div>


    <div class="checkbox">

        <label>

            <input
                id="remember_me"
                name="remember_me"
                type="checkbox"
                value="y">

            Keep me logged in

        </label>

    </div>


    <input
        class="btn btn-default"
        id="submit"
        name="submit"
        type="submit"
        value="Log In">

</form>

{% endblock %}
